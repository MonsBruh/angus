<!doctype html><html><body style="margin:0">
<iframe id="f" src="../index.html" style="width:390px;height:780px;border:0"></iframe>
<pre id="out">running</pre>
<script>
// Headless test: drives each weapon until Angus dies. Usage: test.html#all or #bomb
const f = document.getElementById('f'), log = [], errs = [];
const out = () => { document.getElementById('out').textContent = log.join('\n'); };
let w = null;
const E = s => w.eval(s);
const wait = ms => { E('for(let i=0;i<' + Math.round(ms / 16.7) + ';i++){stepWorld();} render();'); return new Promise(r => setTimeout(r, 5)); };
f.onload = async () => {
  try {
    w = f.contentWindow;
    w.addEventListener('error', e => errs.push(e.message + ' @' + e.lineno));
    E("save.kills=0;save.counts={};");
    log.push('loaded, time=' + E('time.toFixed(2)')); out();
    const mode = location.hash.slice(1) || 'all';
    if (mode.startsWith('shot-')) {
      const sc = mode.slice(5);
      await wait(1500); E('angus.spawnT=0;angus.stun=0');
      if (sc === 'fire') { E("weapon='fire';useWeapon(angus.pts[1].x, angus.pts[1].y)"); await wait(700); }
      if (sc === 'ice') { E("weapon='ice';useWeapon(angus.pts[1].x, angus.pts[1].y)"); await wait(400); }
      if (sc === 'bomb') { E("angus.hp=10;weapon='bomb';useWeapon(angus.pts[2].x+40, angus.pts[2].y)"); await wait(1550); }
      if (sc === 'piano') { E("weapon='piano';useWeapon(angus.pts[2].x, ceilY+20)"); await wait(1100); }
      if (sc === 'hole') { E("weapon='hole';useWeapon(angus.pts[2].x+90, angus.pts[2].y-120)"); await wait(900); }
      if (sc === 'zap') { E("weapon='lightning';useWeapon(angus.pts[1].x, angus.pts[1].y)"); await wait(32); E('flash=0'); }
      if (sc === 'ghost') { E("angus.hp=5;weapon='punch';useWeapon(angus.pts[0].x, angus.pts[0].y)"); await wait(1600); }
      E('render()'); w.document.getElementById('hint').classList.add('gone');
      log.push('shot ' + sc + ' errors ' + JSON.stringify(errs)); out(); return;
    }
    const weapons = ['punch', 'bomb', 'rocket', 'boulder', 'piano', 'lightning', 'fire', 'ice', 'hole', 'grab'];
    for (const wid of weapons) {
      if (mode !== 'all' && mode !== wid) continue;
      await wait(3800);
      E('angus.spawnT=0;angus.stun=0');
      const before = E('save.kills');
      let uses = 0;
      for (let i = 0; i < 12 && E('!angus.dead'); i++) {
        uses++;
        E("weapon='" + wid + "'");
        if (wid === 'grab') {
          E('angus.grab={idx:0,tx:angus.pts[0].x,ty:angus.pts[0].y}');
          for (let k = 0; k < 6; k++) { E('angus.grab.tx=200+' + k * 30 + ';angus.grab.ty=300-' + k * 20); await wait(30); }
          E('angus.grab.tx=0;angus.grab.ty=100'); await wait(30); E("angus.grab=null;angus.flungBy='grab'");
          await wait(900); continue;
        }
        E(['boulder', 'piano'].includes(wid) ? 'useWeapon(angus.pts[2].x, ceilY+20)' : 'useWeapon(angus.pts[1].x, angus.pts[1].y)');
        await wait(wid === 'fire' || wid === 'hole' ? 2500 : 900);
      }
      log.push(wid + ': uses=' + uses + ' dead=' + E('angus.dead') + ' method=' + E('angus.method') + ' style=' + E('angus.style') + ' kills ' + before + '->' + E('save.kills'));
      out();
    }
    log.push('errors: ' + JSON.stringify(errs));
    log.push('counts: ' + JSON.stringify(E('save.counts')));
  } catch (e) { log.push('THREW: ' + e.message + ' ' + e.stack); }
  out();
};
</script></body></html>
